:root{
  --deep:#1a0c2b; --purple:#2c1445; --purple2:#3b1d5e; --purple3:#4a2672;
  --gold:#f2c14e; --gold2:#ffdf8e; --goldd:#c9962e;
  --coral:#ff6b5e; --coral-d:#d94f43;
  --teal:#2ec4b6; --teal-d:#1d9c90; --teal2:#7df9e8;
  --cream:#fff3d9; --paper:#fff6e3; --ink:#33244a; --ink2:#54407a;
  --ring:#b9b0cc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{height:100dvh}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  font-family:'Nunito','Comic Sans MS','Segoe UI',sans-serif;font-weight:700;
  color:var(--cream);font-size:22px;
  background:
    radial-gradient(1200px 700px at 15% -10%, #4a2672 0%, transparent 60%),
    radial-gradient(1000px 700px at 110% 110%, #3b1d5e 0%, transparent 55%),
    var(--deep);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- header ---------- */
header#hdr{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:linear-gradient(180deg,#241038,#2c1445);
  border-bottom:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:30;
}
.logo{width:52px;height:52px;flex:0 0 auto;border-radius:14px;background:var(--paper);
  border:3px solid var(--gold);display:grid;place-items:center;padding:2px}
.logo svg{width:100%;height:100%}
.brand{font-family:'Baloo 2','Trebuchet MS',sans-serif;font-weight:800;font-size:24px;line-height:1.05;color:var(--gold2)}
.brand .sub{font-family:'Kalam',cursive;font-size:15px;color:var(--teal2);font-weight:400}
#playerChip{
  margin-left:auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;
  border-radius:999px;background:var(--teal);color:#10322f;border:3px solid var(--ink);
  font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--ink);
}
#playerChip .dot{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.trbox{display:flex;align-items:center;gap:6px}
#trToggle{min-height:48px;min-width:88px;border-radius:12px;border:3px solid var(--ink);
  background:var(--cream);color:var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;
  box-shadow:0 3px 0 var(--ink)}
#trToggle.on{background:var(--gold)}
#trPin{min-height:48px;min-width:48px;border-radius:12px;border:3px solid var(--ink);
  background:var(--purple3);color:var(--cream);font-size:20px;box-shadow:0 3px 0 var(--ink)}
#trPin.pinned{background:var(--coral)}
nav#steps{display:flex;gap:6px;align-items:center}
.step{min-width:48px;height:48px;border-radius:50%;border:3px solid var(--gold);background:var(--purple2);
  color:var(--cream);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;display:grid;place-items:center}
.step.done{background:var(--teal);color:#10322f;border-color:var(--ink)}
.step.now{background:var(--gold);color:var(--ink);transform:scale(1.12)}
.step.home{border-radius:12px;font-size:22px}

/* ---------- main scroll area ---------- */
main#main{flex:1;overflow-y:scroll;overscroll-behavior-y:contain;min-height:0;-webkit-overflow-scrolling:touch}
.screen{max-width:1240px;margin:0 auto;padding:18px 22px 120px}
.center{text-align:center}

/* ---------- notebook page ---------- */
.page{
  position:relative;background:var(--paper);color:var(--ink);border-radius:20px;
  padding:26px 26px 30px 84px;box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 60px rgba(180,150,90,.18);
  background-image:
    linear-gradient(90deg, transparent 62px, rgba(255,91,91,.55) 62px, rgba(255,91,91,.55) 64px, transparent 64px),
    repeating-linear-gradient(180deg, transparent 0 37px, rgba(84,64,122,.16) 37px 39px);
}
.page::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:26px;
  background-image:radial-gradient(circle at 13px 26px, #241038 5px, var(--ring) 6px, var(--ring) 9px, transparent 10px);
  background-size:26px 64px;background-repeat:repeat-y}
.page h2{font-family:'Baloo 2',sans-serif;font-size:38px;margin:0 0 4px;color:var(--ink);line-height:1.1}
.page h2 .tr{display:block;font-family:'Kalam',cursive;font-size:22px;color:var(--ink2);font-weight:400}
.note{
  display:inline-block;background:#ffe28a;color:#5a4310;font-family:'Kalam',cursive;font-weight:400;
  font-size:21px;line-height:1.25;padding:14px 18px;border-radius:4px;box-shadow:0 5px 8px rgba(0,0,0,.25);
  transform:rotate(-2deg);position:relative;max-width:420px}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:24px;margin-left:-46px;
  background:rgba(255,255,255,.55);border-left:2px dashed rgba(0,0,0,.08);border-right:2px dashed rgba(0,0,0,.08);
  transform:rotate(1.5deg)}
.note.teal{background:#a8ece5;color:#0d4d47;transform:rotate(1.6deg)}
.note.coral{background:#ffc4bd;color:#7a261d;transform:rotate(-1.2deg)}

/* ---------- Bolt + bubble ---------- */
.boltbar{display:flex;align-items:flex-end;gap:14px;margin:6px 0 14px}
.boltbox{width:120px;height:130px;flex:0 0 auto}
.boltbox svg{width:100%;height:100%;overflow:visible}
.bubble{
  position:relative;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:20px;
  font-family:'Kalam',cursive;font-weight:700;font-size:27px;line-height:1.15;padding:12px 20px;max-width:640px;
  box-shadow:0 5px 0 rgba(0,0,0,.3)}
.bubble::before{content:"";position:absolute;left:-22px;bottom:22px;border:12px solid transparent;
  border-right:14px solid var(--ink);border-left:0}
.bubble .tr{display:block;font-size:21px;color:var(--ink2);font-weight:400}
.bubble.say{background:var(--gold2);border-color:var(--goldd)}

/* ---------- generic buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:64px;min-width:64px;padding:10px 26px;border-radius:18px;border:4px solid var(--ink);
  background:var(--gold);color:var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;
  box-shadow:0 6px 0 var(--ink);text-align:center;line-height:1.05}
.btn .tr{display:block;font-family:'Kalam',cursive;font-size:17px;font-weight:400;color:var(--ink2)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.teal{background:var(--teal);color:#0b3833}
.btn.coral{background:var(--coral);color:#4d130d}
.btn.ghost{background:var(--paper)}
.btn.purple{background:var(--purple3);color:var(--cream);border-color:var(--gold);box-shadow:0 6px 0 var(--gold)}
.btn.big{font-size:32px;min-height:76px;padding:14px 40px;border-radius:22px}
.btn.small{font-size:20px;min-height:52px;padding:6px 16px;box-shadow:0 4px 0 var(--ink)}
.btnrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:18px}

/* ---------- scene ---------- */
.scenewrap{position:relative;border-radius:22px;overflow:hidden;border:5px solid var(--gold);
  box-shadow:0 10px 0 rgba(0,0,0,.35);background:#1d0e33}
.scenewrap svg{display:block;width:100%;height:auto}
.obj{cursor:pointer;transition:filter .25s,opacity .25s}
.obj.locked{filter:brightness(.18) saturate(.3)}
.obj.grey{filter:grayscale(.95);opacity:.28}
.obj.said{filter:drop-shadow(0 0 6px rgba(242,193,78,.9))}
.dim{position:absolute;inset:0;background:rgba(14,5,28,.78);pointer-events:none;transition:opacity .4s}
.spot{position:absolute;border-radius:50%;pointer-events:none;border:5px dashed var(--gold);
  box-shadow:0 0 0 4000px rgba(14,5,28,.72), 0 0 40px 8px rgba(242,193,78,.55) inset;
  animation:spotpulse 1.1s ease-in-out infinite}
.ring{position:absolute;border-radius:50%;pointer-events:none;border:6px solid var(--teal2);
  box-shadow:0 0 24px 6px rgba(125,249,232,.8), inset 0 0 18px rgba(125,249,232,.6);
  animation:spotpulse 1s ease-in-out infinite}
.shelfBadge{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;pointer-events:none}

/* ---------- choices (match) ---------- */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.choice{min-height:120px;border-radius:20px;border:4px solid var(--ink);background:var(--cream);
  box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;

.slot.filled{border-style:solid;background:var(--cream);box-shadow:0 4px 0 var(--ink)}
.slot.qword{background:var(--gold2)}
.tray{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}
.tile{min-height:62px;min-width:62px;padding:10px 20px;border-radius:14px;border:4px solid var(--ink);

.tile.gold{background:var(--gold)}
.tile.teal{background:#9fe8e0}

.tile.usedin{opacity:.25;pointer-events:none}
.thchip{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:var(--coral);border:3px solid var(--ink);vertical-align:middle}
.thchip svg{width:22px;height:22px}
.ckchip{display:inline-block;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:999px;

.rulechip{display:inline-block;background:var(--gold2);border:3px dashed var(--goldd);border-radius:14px;
  font-family:'Kalam',cursive;font-weight:700;font-size:22px;color:var(--ink);padding:8px 16px;margin:6px 0}

.num{width:104px;height:104px;border-radius:50%;border:4px solid var(--ink);background:var(--teal);

/* ---------- layout helpers ---------- */
.cols{display:flex;gap:22px;align-items:flex-start}

.qpanel{background:#fff;border:4px solid var(--ink);border-radius:20px;padding:16px 20px;box-shadow:0 6px 0 var(--ink)}

.icn{width:30px;height:30px;vertical-align:-6px}
.hidden{display:none!important}
.mt{margin-top:14px}

/* ---------- keyframes ---------- */
@keyframes pop{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes antwob{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg)}75%{transform:rotate(-9deg)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes flick{0%,100%{opacity:1}3%{opacity:.4}6%{opacity:1}9%{opacity:.55}12%{opacity:1}52%{opacity:1}54%{opacity:.6}56%{opacity:1}57%{opacity:.75}59%{opacity:1}}
@keyframes spotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flys{0%{transform:translate(var(--fx,0),var(--fy,0)) scale(1.4);opacity:.4}100%{transform:translate(0,0) scale(1);opacity:1}}
.bob{animation:bob 2.2s ease-in-out infinite}
.spinonce{animation:spin .8s ease-in-out}
.antenna{transform-origin:50% 100%;animation:antwob 1.2s ease-in-out infinite}

@media (max-width:1000px){
  .brand .sub{display:none}

}

const shelfGroups=s=>{ // ordered type groups on shelf s
  const g={}; INV.filter(i=>i.shelf===s).forEach(i=>{(g[i.type]=g[i.type]||[]).push(i)});
  return Object.entries(g).map(([t,arr])=>({t,cx:arr.reduce((a,i)=>a+i.x,0)/arr.length})).sort((a,b)=>a.cx-b.cx).map(o=>o.t);
};
const neighbours=t=>{const it=INV.find(i=>i.type===t),g=shelfGroups(it.shelf),k=g.indexOf(t);
  return [g[k-1],g[k+1]].filter(Boolean)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---- Turkish gloss: ONLY glossary sentences + words/colors/numbers/ui ---- */
function glossOf(en){
  if(CONFIG.gloss[en])return CONFIG.gloss[en];
  if(CONFIG.ui[en])return CONFIG.ui[en];
  for(const t in W)if(W[t].label===en||plural(t)===en)return W[t].tr;
  if(CONFIG.colors[en])return CONFIG.colors[en];
  for(const n in CONFIG.numbers)if(CONFIG.numbers[n][0]===en)return CONFIG.numbers[n][1];
  return null;
}
const glossSpan=(en,cls='tr')=>{const g=S.tr&&glossOf(en);return g?`<span class="${cls}">${esc(g)}</span>`:''};
/* for generated questions: noun (and color) glosses only */
function partsGloss(parts){ // parts: [{en, kind}]
  if(!S.tr)return '';
  const gs=parts.filter(p=>p.kind&&p.kind!=='sent').map(p=>glossOf(p.en)).filter(Boolean);
  return gs.length?`<span class="tr">${gs.map(esc).join(' · ')}</span>`:'';
}

    `<button class="step${S.done[n]?' done':''}${S.screen===n?' now':''}" data-go="${n}">${n}</button>`).join('');
  steps.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
  $('#playerChip').classList.toggle('hidden',S.screen===0);

}
function updateTRbtn(){
  const b=$('#trToggle');b.textContent=S.tr?'EN+TR':'EN';b.classList.toggle('on',S.tr);
  $('#trPin').classList.toggle('pinned',S.trPinned);$('#trPin').innerHTML=ICON.pin(S.trPinned);
}
$('#trToggle').addEventListener('click',()=>{S.tr=!S.tr;updateTRbtn();rerender()});
$('#trPin').addEventListener('click',()=>{S.trPinned=!S.trPinned;updateTRbtn()});

/* ---- router ---- */
const SCREENS=()=>[renderStart,renderAct1,renderAct2,renderAct3,renderAct4,renderAct5,renderAct6,renderAct7];
function go(n){
  S.screen=n;
  if(n>=3&&n<=6&&!S.trPinned)S.tr=false;      // support fades: TR auto-off from Act 3
  if(n>=1&&n<=2&&!S.trPinned)S.tr=true;       // TR on by default in Act 1-2
  renderHeader();SCREENS()[n]();$('#main').scrollTop=0;
}
function rerender(){renderHeader();SCREENS()[S.screen]()}
function flipTurn(){S.turn=1-S.turn;renderHeader()}

/* ---- Bolt bar ---- */
function boltbar(expr,text,trText){
  return `<div class="boltbar"><div class="boltbox" id="boltSlot">${boltSVG(expr)}</div>
    <div class="bubble" id="bubbleSlot">${esc(text)}${trText&&S.tr?`<span class="tr">${esc(trText)}</span>`:''}</div></div>`;
}
function setBolt(expr){const b=$('#boltSlot');if(b){b.classList.remove('spinonce');void b.offsetWidth;
  b.innerHTML=boltSVG(expr);if(expr==='cheering')b.classList.add('spinonce')}}
function setBubble(html){const b=$('#bubbleSlot');if(b)b.innerHTML=html}

/* ---- feedback ---- */
function burst(cb){
  const el=$('#burst');
  el.innerHTML=`<svg viewBox="0 0 200 200"><polygon points="${starPts(100,100,95,48,12)}" fill="#f2c14e" stroke="${INK}" stroke-width="5"/>
    <circle cx="100" cy="100" r="52" fill="#2ec4b6" stroke="${INK}" stroke-width="5"/>
    <path d="M 74 102 L 93 121 L 130 80" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  el.classList.add('show');
  setTimeout(()=>{el.classList.remove('show');el.innerHTML='';cb&&cb()},900);
}
function wobble(el){if(!el)return;el.classList.remove('wobble');void el.offsetWidth;el.classList.add('wobble')}
function recordHint(){S.stats[S.turn].hints++}
function recordMiss(t){if(t)S.stats[S.turn].missed.add(t)}

/* hint ladder: wrong1 spotlight cb, wrong2 gloss+first letter, wrong3 reveal + requeue */
function hintStep(h,spotCB,hintHTML,revealCB){
  h.n++;recordHint();
  if(h.n===1){setBolt('thinking');spotCB&&spotCB()}
  else if(h.n===2){setBolt('thinking');const hb=$('#hintbox');if(hb){hb.innerHTML=hintHTML;hb.classList.remove('hidden')}}
  else if(h.n>=3){setBolt('oops');revealCB&&revealCB()}
}
function hintHTMLFor(word){
  const g=glossOf(word);const fl=word[0].toUpperCase();
  return `Hint: <b>${g?esc(g)+' — ':''}${fl}…</b> ${CONFIG.ui['Try again']&&S.tr?`<span style="color:var(--ink2)">(${esc(CONFIG.ui['Try again'])})</span>`:''}`;
}

/* spotlight(s) over scene objects; wrap = .scenewrap element */
function spotlight(ids,ms,ringOnly){
  const wrap=$('.scenewrap');if(!wrap)return;
  clearSpots();
  const rect=wrap.getBoundingClientRect(),sx=rect.width/1200,sy=rect.height/800;
  ids.forEach(id=>{
    const it=INV.find(i=>i.id===id);if(!it)return;
    const d=document.createElement('div');
    d.className=ringOnly?'ring':'spot';
    const w=(it.type==='bike'?170:150)*sx, h=w;
    d.style.width=w+'px';d.style.height=h+'px';
    d.style.left=(it.x*sx-w/2)+'px';
    d.style.top=((CONFIG.shelfY[it.shelf]-55)*sy-h/2)+'px';
    wrap.appendChild(d);
  });
  if(ms)setTimeout(clearSpots,ms);
}
function clearSpots(){$$('.spot,.ring').forEach(e=>e.remove())}

/* ---- sentence celebration bar ---- */
function sayBar(sent,gloss,onNext,nextLabel){
  return `<div class="saybar" id="saybar">
    <div style="width:52px;height:52px;flex:0 0 auto">${ICON.tick}</div>
    <div class="sent">${sent}${gloss?`<span class="tr">${esc(gloss)}</span>`:''}</div>
    <div class="saycue">${ICON.say} Say it!${S.tr?` <span style="color:var(--ink2)">· ${esc(CONFIG.ui['Say it!'])}</span>`:''}</div>
    <button class="btn teal" id="nextBtn">${nextLabel||'Next'}${S.tr&&glossOf(nextLabel||'Next')?`<span class="tr">${esc(glossOf(nextLabel||'Next'))}</span>`:''}</button>
  </div>`;
}
function bindNext(fn){const b=$('#nextBtn');if(b)b.addEventListener('click',fn)}

/* ---- shared tile builder ----
   spec: {slots:n, tiles:[{id,t,cls}], accept(tokens)->bool, onCorrect, onWrong, liveCheck}  */
function buildTiles(mount,spec){
  const state={placed:new Array(spec.slots).fill(null)};
  const tray=spec.shuffle===false?spec.tiles:shuffle(spec.tiles);
  mount.innerHTML=`<div class="buildrow" data-slots></div><div class="tray" data-tray></div>`;
  const row=mount.querySelector('[data-slots]'),trayEl=mount.querySelector('[data-tray]');
  function draw(){
    row.innerHTML='';trayEl.innerHTML='';
    for(let i=0;i<spec.slots;i++){
      const p=state.placed[i];
      const s=document.createElement('button');
      s.className='slot'+(p?' filled':'');s.dataset.slot=i;
      s.innerHTML=p?p.html:'&nbsp;';
      s.addEventListener('click',()=>{if(state.placed[i]){state.placed[i]=null;draw()}});
      row.appendChild(s);
    }
    tray.forEach(tl=>{
      if(state.placed.includes(tl))return;
      const b=document.createElement('button');
      b.className='tile '+(tl.cls||'');
      b.innerHTML=tl.html;
      b.addEventListener('click',()=>{const i=state.placed.indexOf(null);if(i<0)return;state.placed[i]=tl;draw();check()});
      trayEl.appendChild(b);
    });
    spec.onDraw&&spec.onDraw(row,trayEl,state);
  }
  function tokens(){return state.placed.map(p=>p?p.t:null)}
  function check(){
    if(state.placed.includes(null))return;
    if(spec.accept(tokens()))spec.onCorrect(tokens());
    else spec.onWrong(tokens());
  }
  draw();
  return {reset(){state.placed.fill(null);draw()},tokens};
}
const tile=(t,cls,html)=>({t,cls:cls||'',html:html||esc(t)});
</script>

/* end-of-activity screen */
function completeScreen(n,calc,small){

/* ============================================================
   SCREEN 0 — START
   ============================================================ */
function renderStart(){
  $('#main').innerHTML=`<div class="screen">
    <div class="page">
      <div class="cols">
        <div class="grow">

          </div>

        </div>
        <div style="flex:0 0 46%"><div class="scenewrap">${sceneSVG({dark:true,shelvesStocked:{},shelvesLit:{}})}</div>
          <div class="note teal" style="margin-top:14px">Tap the TR button any time: EN ↔ EN+TR</div></div>
      </div>
    </div></div>`;
  $('#startBtn').addEventListener('click',()=>{
    const p1=$('#p1').value.trim(),p2=$('#p2').value.trim();
    if(p1)S.players[0]=p1; if(p2)S.players[1]=p2;
    go(1);
  });
  $('#resetAll').addEventListener('click',globalReset);
}
function globalReset(){
  openModal(`<h2>Reset everything?</h2>
    <p style="font-size:24px">All stars, stamps and progress will be cleared.</p>
    <div class="btnrow"><button class="btn coral" id="cfYes">Yes, reset</button>
    <button class="btn ghost" id="cfNo">Cancel</button></div>`);
  $('#cfYes').addEventListener('click',()=>{
    S.stars=0;S.actStars={};S.stage=0;S.open=false;S.saidWords=new Set();S.done={};
    S.stats=[{hints:0,missed:new Set()},{hints:0,missed:new Set()}];S.turn=0;
    closeModal();go(0);
  });
  $('#cfNo').addEventListener('click',closeModal);
}

/* ============================================================
   ACTIVITY 1 — Listen and say (poster tour)
   ============================================================ */
const A1={batch:0};
function batchTypes(i){return Object.keys(CONFIG.words).filter(t=>W(t).batch===CONFIG.batches[i].id)}
function renderAct1(){
  const unlocked=new Set(CONFIG.batches.slice(0,A1.batch+1).flatMap(b=>batchTypes(CONFIG.batches.indexOf(b))));
  const locks=new Set(Object.keys(CONFIG.words).filter(t=>!unlocked.has(t)));
  const curTypes=batchTypes(A1.batch);
  const batchDone=curTypes.every(t=>S.saidWords.has(t));
  const allDone=Object.keys(CONFIG.words).every(t=>S.saidWords.has(t));
  const dots=Object.keys(CONFIG.words).map(t=>{
    const locked=locks.has(t),said=S.saidWords.has(t);
    return `<span style="display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;padding:6px 12px;border-radius:999px;border:3px solid ${said?'var(--goldd)':locked?'#9a8db5':'var(--ink2)'};background:${said?'var(--gold2)':'#fff'};font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--ink)">
      ${said?'★':locked?'·':'○'} ${label(t)}${S.tr?` <span class="tr" style="font-family:'Kalam';font-weight:400">${esc(W(t).tr)}</span>`:''}</span>`}).join('');
  $('#main').innerHTML=`<div class="screen">
    <div class="page">
      <h2>1 · Listen and say <span class="tr">poster tour</span></h2>
      ${boltbar('welcome',`Tap an object. Say it!`,null)}
      <div class="scenewrap" id="scene1">${sceneSVG({full:true,interactive:true,locks,said:S.saidWords})}</div>
      <div class="mt">${dots}</div>
      <div id="batchAction" class="btnrow" style="justify-content:flex-start"></div>
    </div></div>`;
  if(allDone){
    $('#batchAction').innerHTML=`<button class="btn teal big" id="fin1">Finish: stock the shelf!</button>`;
    $('#fin1').addEventListener('click',()=>{
      addStars(1,S.saidWords.size);
      completeScreen(1,`11 words said = 11 stars<small>picture + word + "Say it" tick for each</small>`);
    });
  }else if(batchDone&&A1.batch<2){
    $('#batchAction').innerHTML=`<button class="btn teal big" id="openBatch">Great! Open the ${CONFIG.batches[A1.batch+1].label} words${S.tr?`<span class="tr">${esc(CONFIG.ui['Great!'])}</span>`:''}</button>`;
    $('#openBatch').addEventListener('click',()=>{A1.batch++;burst();setTimeout(renderAct1,350)});
  }else{
    $('#batchAction').innerHTML=`<div class="rulechip">${ICON.ear} Teacher says → You say · Batch ${A1.batch+1} of 3: ${CONFIG.batches[A1.batch].label}</div>`;
  }
  $$('#scene1 .obj').forEach(g=>g.addEventListener('click',()=>{
    const t=g.dataset.type;
    if(locks.has(t)){wobble(g);setBolt('oops');setBubble(`Say the ${CONFIG.batches[A1.batch].label} words first!`);setTimeout(()=>setBolt('welcome'),1200);return}
    wordCard(t);

}
function wordCard(t){

      </div>
    </div>`);

  });
}

<script>
'use strict';
/* ============================================================
   ACTIVITY 2 — Stock the shelf: word match (2 rounds x 6)
   ============================================================ */
const A2={queue:[],i:0,score:0,started:false};
function startAct2(){
  A2.queue=[...CONFIG.match.round1.map(q=>({...q,round:1})),...CONFIG.match.round2.map(q=>({...q,round:2}))];
  A2.i=0;A2.score=0;A2.started=true;renderAct2();
}
function renderAct2(){
  if(!A2.started)startAct2();
  if(A2.i>=A2.queue.length){
    addStars(2,A2.score);
    completeScreen(2,`${A2.queue.length} cards · ${A2.score} correct = ${A2.score} stars<small>round 1: picture + word · round 2: picture only · 3 choices</small>`);
    A2.started=false;return;
  }
  const q=A2.queue[A2.i];
  if(q.round===2&&A2.i===CONFIG.match.round1.length&&!q.introDone){
    q.introDone=true;
    $('#main').innerHTML=`<div class="screen"><div class="page center">
      ${boltbar('thinking','Round 2: pictures only!')}
      <div class="note teal">Now the word is hidden. You can do it!</div>
      <div class="btnrow"><button class="btn teal big" id="r2go">Go!</button></div></div></div>`;
    $('#r2go').addEventListener('click',renderAct2);return;
  }
  const showLabel=q.round===1; // full support round
  const target=q.mode==='pic2word'
    ?`<div class="targetcard"><svg viewBox="-75 -135 150 150">${objSVG(q.t,itemsOf(q.t)[0].color)}</svg>${showLabel?`<div class="targetword">${esc(label(q.t))}${S.tr?`<span class="tr">${esc(W(q.t).tr)}</span>`:''}</div>`:''}</div>`
    :`<div class="targetcard"><div class="targetword">${showLabel?label(q.t):esc(label(q.t))}${S.tr?`<span class="tr">${esc(W(q.t).tr)}</span>`:''}</div></div>`;
  // choices
  const others=shuffle(Object.keys(CONFIG.words).filter(x=>x!==q.t)).slice(0,2);
  const opts=shuffle([q.t,...others]);
  const choiceHTML=opts.map(t2=>{
    const ok=t2===q.t;
    return q.mode==='pic2word'
      ?`<button class="choice" data-ok="${ok?1:0}"><span>${esc(label(t2))}</span>${S.tr?`<span class="tr">${esc(W(t2).tr)}</span>`:''}</button>`
      :`<button class="choice" data-ok="${ok?1:0}"><svg viewBox="-75 -135 150 150">${objSVG(t2,itemsOf(t2)[0].color)}</svg></button>`;
  }).join('');
  $('#main').innerHTML=`<div class="screen"><div class="page">
    <h2>2 · Stock the shelf <span class="tr">round ${q.round} · card ${A2.i+1} of ${A2.queue.length}</span></h2>
    ${boltbar('thinking',q.mode==='pic2word'?'Tap the word!':'Tap the picture!',S.tr?CONFIG.ui['Tap']:null)}
    ${targetcard(target)}
    <div class="choices" id="ch">${choiceHTML}</div>
    <div class="hintbox hidden" id="hintbox"></div>
    <div id="sayMount"></div>
  </div></div>`;
  const h={n:0};let lock=false;
  $$('#ch .choice').forEach(b=>b.addEventListener('click',()=>{
    if(lock)return;
    if(b.dataset.ok==='1'){
      lock=true;A2.score++;setBolt('cheering');burst();
      $('#sayMount').innerHTML=sayBar(`<b>${esc(label(q.t))}</b>`,S.tr?W(q.t).tr:null);
      bindNext(()=>{flipTurn();A2.i++;renderAct2()});
      $('#ch').style.pointerEvents='none';
    }else{
      wobble(b);recordMiss(q.t);
      hintStep(h,
        ()=>{ // spotlight: fade one wrong choice
          const wrongs=$$('#ch .choice').filter(x=>x.dataset.ok==='0'&&!x.classList.contains('faded'));
          if(wrongs.length)wrongs[0].classList.add('faded');
          setBubble('Look again! One door closes.');
        },
        hintHTMLFor(label(q.t)),
        ()=>{ // reveal + requeue
          const right=$('#ch .choice[data-ok="1"]');if(right)right.style.outline='6px solid var(--teal)';
          setBubble('Say it with me!');
          lock=true;
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${esc(label(q.t))}</b>${S.tr?`<span class="tr">${esc(W(q.t).tr)}</span>`:''}</div>
            <div class="saycue">${ICON.say} Say it with me!</div>
            <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
          A2.queue.push(q); // item returns later
          bindNext(()=>{flipTurn();A2.i++;renderAct2()});
          $('#ch').style.pointerEvents='none';
        });
    }
  }));
}
function targetcard(t){return t}
</script>
<script>

          <div class="qtext">${esc(qtext)}${gloss}</div>
          <div class="rulechip">${ICON.th?ICON.th:''} th: tongue between teeth! &nbsp;·&nbsp; 1 = is · 2+ = are <b style="color:var(--goldd)">+ s</b></div>
          <div class="numpad" id="numpad">${[1,2,3,4,5,6].map(k=>`<button class="num" data-n="${k}">${k}<span class="tr">${S.tr?esc(CONFIG.numbers[k][1]):esc(CONFIG.numbers[k][0])}</span></button>`).join('')}</div>
          <div class="hintbox hidden" id="hintbox"></div>
          <div id="buildMount"></div>
          <div id="sayMount"></div>
        </div>
      </div>
    </div>
  </div></div>`;
  const h={n:0};
  $$('#numpad .num').forEach(b=>b.addEventListener('click',()=>{
    const k=+b.dataset.n;
    if(k===n){setBolt('cheering');burst();buildSentence3(t,n,h)}
    else{
      wobble(b);recordMiss(t);
      hintStep(h,
        ()=>{spotlight(itemsOf(t).map(i=>i.id),2600);setBubble('Look at the shelf!')},
        hintHTMLFor(CONFIG.numbers[n][0]),
        ()=>{ // reveal number, requeue
          setBubble('Say it with me!');lockPad();
          spotlight(itemsOf(t).map(i=>i.id));
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${n}</b> — ${esc(CONFIG.numbers[n][0])}${S.tr?`<span class="tr">${esc(CONFIG.numbers[n][1])}</span>`:''}</div>
            <div class="saycue">${ICON.say} Say it with me!</div>
            <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
          A3.queue.push(t);
          bindNext(()=>{clearSpots();flipTurn();A3.i++;renderAct3()});
        });
    }
  }));
  function lockPad(){$('#numpad').style.pointerEvents='none'}
}
function buildSentence3(t,n,h){
  const many=n>1, numWord=CONFIG.numbers[n][0];
  const expected=many?['There','are',numWord,t,'-s']:['There','is','one',t];
  const distractors=many?['is','two']:['are','two'];
  const tiles=[
    tile('There','gold','There '+ICON.th),
    tile(many?'are':'is','teal'),
    tile(numWord,'teal',numWord+(numWord==='three'?' '+ICON.th:'')),
    tile(t,'coral',esc(many?label(t):label(t))),
  ];
  if(many)tiles.push(tile('-s','gold','-s'));
  distractors.forEach(d=>tiles.push(tile(d,'')));
  $('#buildMount').innerHTML=`<div class="qtext" style="font-size:26px;margin-top:10px">Now build it! ${S.tr?`<span class="tr">${esc(W(t).tr)}</span>`:''}</div><div id="tb"></div>`;
  buildTiles($('#tb'),{
    slots:expected.length, tiles,
    onDraw(row){ // gold -s flies onto the noun
      [...row.children].forEach(s=>{if(s.textContent.trim()==='-s'&&!s.dataset.flew){s.dataset.flew=1;s.style.animation='flys .5s ease-out'}});
    },
    accept:tok=>tok.join('|')===expected.join('|'),
    onCorrect(){
      if(h.n<3)A3.score++;
      setBolt('cheering');burst();
      const sent=many?`There are ${numWord} ${plural(t)}.`:`There is one ${label(t)}.`;
      const g=S.tr?(CONFIG.gloss[sent]||`${esc(CONFIG.numbers[n][1])} · ${esc(W(t).tr)}`):null;
      $('#buildMount').innerHTML='';$('#numpad').style.pointerEvents='none';
      $('#sayMount').innerHTML=sayBar(sent,g);
      bindNext(()=>{clearSpots();flipTurn();A3.i++;renderAct3()});
    },
    onWrong(){
      recordMiss(t);
      hintStep(h,
        ()=>{setBubble('Check: is, are, number, -s!')},
        `<span>Hint: <b>There ${many?'are':'is'}…</b> ${many?'gold <b>-s</b> tile!':''}</span>`,
        ()=>{ // reveal sentence, requeue
          setBubble('Say it with me!');
          const sent=many?`There are ${numWord} ${plural(t)}.`:`There is one ${label(t)}.`;
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${sent}</b></div>
            <div class="saycue">${ICON.say} Say it with me!</div>
            <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
          A3.queue.push(t);
          bindNext(()=>{flipTurn();A3.i++;renderAct3()});
        });
    }
  });
}

/* ============================================================
   ACTIVITY 4 — Is there a...? detective
   ============================================================ */
const A4={queue:[],i:0,score:0,started:false};
function renderAct4(){

          <button class="btn coral big" data-a="no">No, there isn't.${S.tr?`<span class="tr">${esc(CONFIG.gloss["No, there isn't."])}</span>`:''}</button>

      // proof: spotlight the item (or all of that type to show absence)
      const ids=yes?itemsOf(q.t).filter(i=>i.color===q.c).map(i=>i.id):itemsOf(q.t).map(i=>i.id);
      spotlight(ids,0,yes);
      $('#proof').innerHTML=`<div class="hintbox" style="border-color:var(--teal-d)">${ICON.find} ${yes?'There it is! Spotlight = proof.':'Look: no '+esc(q.c)+' one. Empty spot!'}</div>`;
      const sent=yes?'Yes, there is.':"No, there isn't.";
      $('#sayMount').innerHTML=sayBar(sent,S.tr?CONFIG.gloss[sent]:null);
      bindNext(()=>{clearSpots();flipTurn();A4.i++;renderAct4()});
    }else{
      wobble(b);recordMiss(q.t);
      hintStep(h,
        ()=>{spotlight(itemsOf(q.t).map(i=>i.id),2800);setBubble('Check the shelf!')},
        hintHTMLFor(label(q.t)),
        ()=>{lock=true;setBolt('oops');setBubble('Say it with me!');
          const sent=yes?'Yes, there is.':"No, there isn't.";
          const ids=yes?itemsOf(q.t).filter(i=>i.color===q.c).map(i=>i.id):itemsOf(q.t).map(i=>i.id);
          spotlight(ids,0,yes);
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${sent}</b>${S.tr?`<span class="tr">${esc(CONFIG.gloss[sent])}</span>`:''}</div>
            <div class="saycue">${ICON.say} Say it with me!</div>
            <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
          A4.queue.push(q);
          bindNext(()=>{clearSpots();flipTurn();A4.i++;renderAct4()});
        });

  }));
}

<script>
'use strict';
/* ============================================================
   ACTIVITY 5 — Guessing game (textbook dialogue)
   ============================================================ */
const A5={mode:null,round:0,secret:null,grey:new Set(),qcount:0,score:0,phase:'menu',h:{n:0}};
function renderAct5(){
  if(A5.phase==='menu'){
    $('#main').innerHTML=`<div class="screen"><div class="page center">
      <h2>5 · Guessing game <span class="tr">the exact textbook dialogue</span></h2>
      ${boltbar('welcome',"I'm thinking of an object…",S.tr?CONFIG.gloss["I'm thinking of an object in the poster."]:null)}
      <div class="choices" style="grid-template-columns:1fr 1fr;max-width:820px;margin:18px auto 0">
        <button class="choice" id="modeA" style="min-height:150px"><span style="font-size:34px">Mode A</span><span>Bolt thinks!</span></button>
        <button class="choice" id="modeB" style="min-height:150px"><span style="font-size:34px">Mode B</span><span>Partner thinks!</span></button>
      </div></div></div>`;
    $('#modeA').addEventListener('click',()=>{A5.mode='A';A5.round=0;A5.score=0;startGuessRound()});
    $('#modeB').addEventListener('click',()=>{A5.mode='B';A5.round=0;A5.score=0;startCover()});
    return;
  }
  if(A5.phase==='done'){
    addStars(5,A5.score);
    completeScreen(5,`${CONFIG.guessRounds} mysteries · ${A5.score} solved = ${A5.score} stars<small>grey = ruled out · questions build from tiles</small>`);
    A5.phase='menu';return;
  }
  guessBoard();
}
function startCover(){ // Mode B: thinker secretly picks
  A5.phase='cover';
  $('#main').innerHTML=`<div class="screen"><div class="page center">
    ${boltbar('thinking','Guesser, close your eyes!')}
    <div class="note coral" style="font-size:26px">Thinker: secretly tap ONE object,<br>then tap "Hide it".</div>
    <div class="btnrow"><button class="btn teal big" id="thinkerGo">I'm the thinker — show me</button></div>
  </div></div>`;
  $('#thinkerGo').addEventListener('click',()=>{
    A5.phase='pick';
    $('#main').innerHTML=`<div class="screen"><div class="page">
      ${boltbar('thinking','Thinker: tap your secret!')}
      <div class="scenewrap" id="scene5">${sceneSVG({full:true,interactive:true})}</div>
      <div class="btnrow"><button class="btn coral big hidden" id="hideIt">Hide it</button></div>
    </div></div>`;
    $$('#scene5 .obj').forEach(g=>g.addEventListener('click',()=>{
      $$('#scene5 .obj').forEach(x=>x.classList.remove('said'));
      g.classList.add('said');
      A5.secret=INV.find(i=>i.id===g.dataset.id);
      $('#hideIt').classList.remove('hidden');
    }));
    $('#hideIt').addEventListener('click',()=>{A5.grey=new Set();A5.qcount=0;A5.h={n:0};A5.phase='ask';renderAct5()});
  });
}
function startGuessRound(){
  A5.secret=INV[Math.floor(Math.random()*INV.length)]; // unique type+color by design
  A5.grey=new Set();A5.qcount=0;A5.h={n:0};A5.phase='ask';renderAct5();
}
function candidates(){return INV.filter(i=>!A5.grey.has(i.id))}
function guessBoard(){
  const cands=candidates();
  $('#main').innerHTML=`<div class="screen"><div class="page">
    <h2>5 · Guessing game <span class="tr">mode ${A5.mode} · mystery ${A5.round+1} of ${CONFIG.guessRounds}</span></h2>
    ${boltbar('thinking',A5.mode==='A'?"I'm thinking of an object…":'Ask your partner!',S.tr&&A5.mode==='A'?CONFIG.gloss["I'm thinking of an object in the poster."]:null)}
    <div class="cols">
      <div style="flex:0 0 56%"><div class="scenewrap" id="scene5">${sceneSVG({full:true,interactive:true,grey:A5.grey})}</div>
        <div class="turnnote">${cands.length} object${cands.length>1?'s':''} still in the game</div></div>
      <div class="grow"><div class="qpanel">
        <div class="qtext" style="font-size:28px">Build a question:</div>
        <div class="btnrow" id="qkind">
          <button class="btn" data-k="type">Is it a ___? <small style="font-size:18px">object</small></button>
          <button class="btn teal" data-k="color">Is it ___? <small style="font-size:18px">color</small></button>
        </div>
        <div id="tb"></div>
        <div id="answerRow"></div>
        <div class="hintbox hidden" id="hintbox"></div>
        <div class="btnrow"><button class="btn coral" id="iknow">I know! Tap it!</button></div>
        <div id="sayMount"></div>
      </div></div>
    </div>
  </div></div>`;
  $$('#qkind [data-k]').forEach(b=>b.addEventListener('click',()=>buildQuestion(b.dataset.k)));
  $$('#scene5 .obj').forEach(g=>g.addEventListener('click',()=>{ // only used in guess phase
    if(A5.phase!=='guess'){wobble(g);return}
    tryGuess(g.dataset.id,g);
  }));
  $('#iknow').addEventListener('click',()=>{
    A5.phase='guess';setBolt('welcome');setBubble('Tap the object in the poster!');
    $('#scene5').style.outline='6px dashed var(--teal2)';
  });
}
function buildQuestion(kind){
  const types=Object.keys(CONFIG.words), colors=Object.keys(CONFIG.colors);
  const expected = kind==='type'?['Is','it','a','T','?']:['Is','it','C','?'];
  const distractor = kind==='type'?tile('T2','coral',esc(label(types[Math.floor(Math.random()*types.length)]))):tile('C2','',colors[Math.floor(Math.random()*colors.length)]);
  const pool = kind==='type'
    ?[tile('Is','gold'),tile('it','teal'),tile('a','coral'),tile('T','coral','___ ('+esc('object')+')'),tile('?',''),distractor]
    :[tile('Is','gold'),tile('it','teal'),tile('C','','___ ('+esc('color')+')'),tile('?',''),distractor];
  // let the student pick the word: tapping the ___ tile cycles? simpler: word chosen by picker below
  $('#tb').innerHTML=`<div class="qtext" style="font-size:24px;margin-top:8px">${kind==='type'?'Pick the object word:':'Pick the color:'}</div>
    <div class="tray" id="pickRow"></div><div id="tb2"></div>`;
  const opts = kind==='type'?types:colors;
  $('#pickRow').innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='tile '+(kind==='type'?'coral':'');
    b.innerHTML=esc(kind==='type'?label(o):o)+(S.tr?` <span class="tr" style="font-size:16px">${esc(kind==='type'?W(o).tr:CONFIG.colors[o])}</span>`:'');
    b.addEventListener('click',()=>buildQuestion2(kind,o));
    $('#pickRow').appendChild(b);
  });
  // picker grid is long for types: 11 — fine, wraps.
}
function buildQuestion2(kind,word){
  const expected=kind==='type'?['Is','it','a',word,'?']:['Is','it',word,'?'];
  const tiles=kind==='type'
    ?[tile('Is','gold'),tile('it','teal'),tile('a','coral'),tile(word,'coral',esc(label(word))),tile('?',''),tile('__d','',esc(label(word==='bike'?'ball':'bike')))]
    :[tile('Is','gold'),tile('it','teal'),tile(word,'',word),tile('?',''),tile('__d','',word==='blue'?'red':'blue')];
  $('#tb2').innerHTML='';
  buildTiles($('#tb2'),{
    slots:expected.length,tiles,shuffle:true,
    accept:tok=>tok.join('|')===expected.join('|'),
    onCorrect(){
      setBolt('thinking');
      const qsent=kind==='type'?`Is it a ${label(word)}?`:`Is it ${word}?`;
      const ans = kind==='type' ? (A5.secret.type===word) : (A5.secret.color===word);
      if(A5.mode==='A'){
        answerAndGrey(kind,word,ans,qsent);
      }else{ // thinker taps the answer
        $('#answerRow').innerHTML=`<div class="qtext" style="font-size:26px;margin-top:8px">${esc(qsent)}</div>
          <div class="turnnote">Thinker — answer:</div>
          <div class="btnrow"><button class="btn teal" data-t="1">Yes, it is.${S.tr?`<span class="tr">${esc(CONFIG.gloss['Yes, it is.'])}</span>`:''}</button>
          <button class="btn coral" data-t="0">No, it isn't.${S.tr?`<span class="tr">${esc(CONFIG.gloss["No, it isn't."])}</span>`:''}</button></div>`;
        $$('#answerRow [data-t]').forEach(b=>b.addEventListener('click',()=>{
          const truthful=b.dataset.t==='1';
          answerAndGrey(kind,word,truthful,qsent);
        }));
      }
    },
    onWrong(){
      setBolt('oops');setBubble('Word order! "Is" comes first.');
      wobble($('#tb2'));
    }
  });
}
function answerAndGrey(kind,word,ans,qsent){
  A5.qcount++;
  // grey out objects that no longer fit
  INV.forEach(i=>{
    const match=kind==='type'?i.type===word:i.color===word;
    if(ans?!match:match)A5.grey.add(i.id);
  });
  const sent=ans?'Yes, it is.':"No, it isn't.";
  setBubble(`${esc(sent)}${S.tr?` <span class="tr">${esc(CONFIG.gloss[sent])}</span>`:''}`);
  setBolt(ans?'cheering':'thinking');
  const cands=candidates();
  $('#sayMount').innerHTML=`<div class="saybar"><div class="sent">${esc(qsent)}<span style="color:var(--ink2)"> → </span><b>${sent}</b>${S.tr?`<span class="tr">${esc(CONFIG.gloss[sent])}</span>`:''}</div>
    <div class="saycue">${ICON.say} Say it!${S.tr?` <span style="color:var(--ink2)">· ${esc(CONFIG.ui['Say it!'])}</span>`:''}</div>
    <button class="btn teal" id="nextBtn">${cands.length===1?'Tap I know!':'Ask again'}</button></div>`;
  bindNext(()=>{A5.phase='ask';guessBoard()});
}
function tryGuess(id,g){
  const h=A5.h;
  if(id===A5.secret.id){
    setBolt('cheering');burst();
    if(h.n<3)A5.score++;
    const s=A5.secret, sent=`I know! It's the ${s.color} ${label(s.type)}.`;
    $('#scene5').style.outline='';
    spotlight([s.id],0,true);
    $('#sayMount').innerHTML=sayBar(sent,S.tr?`${esc(CONFIG.colors[s.color])} · ${esc(W(s.type).tr)}`:null);
    bindNext(()=>{
      clearSpots();flipTurn();A5.round++;
      if(A5.round>=CONFIG.guessRounds){A5.phase='done';renderAct5()}
      else if(A5.mode==='A')startGuessRound(); else startCover();
    });
  }else{
    wobble(g);recordMiss(A5.secret.type);
    hintStep(h,
      ()=>{spotlight(candidates().map(i=>i.id),2600);setBubble('Look at the clues!')},
      hintHTMLFor(label(A5.secret.type)),
      ()=>{setBolt('oops');setBubble('Say it with me!');
        spotlight([A5.secret.id],0,true);
        const s=A5.secret,sent=`It's the ${s.color} ${label(s.type)}.`;
        $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${sent}</b></div>
          <div class="saycue">${ICON.say} Say it with me!</div>
          <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
        bindNext(()=>{clearSpots();flipTurn();A5.round++;
          if(A5.round>=CONFIG.guessRounds){A5.phase='done';renderAct5()}
          else if(A5.mode==='A')startGuessRound();else startCover();});
      });
  }
}
</script>
<script>
'use strict';
/* ============================================================
   ACTIVITY 6 — Ask, find and say
   ============================================================ */
const A6={queue:[],i:0,score:0,started:false,phase:'find'};
function renderAct6(){
  if(!A6.started){A6.queue=[...CONFIG.find];A6.i=0;A6.score=0;A6.started=true}
  if(A6.i>=A6.queue.length){
    addStars(6,A6.score);A6.started=false;

  }
  const q=A6.queue[A6.i];
  A6.phase='find';
  const col=itemsOf(q.t)[0].color;
  $('#main').innerHTML=`<div class="screen"><div class="page">
    <h2>6 · Ask, find and say <span class="tr">clue ${A6.i+1} of ${A6.queue.length}</span></h2>
    ${boltbar('thinking','Find it in the poster!',S.tr?CONFIG.ui['Find']:null)}
    <div class="zoomrow">
      <div class="zoomcirc"><svg viewBox="${ZOOMVB[q.zoom]}">${objSVG(q.t,col)}</svg></div>
      <svg class="magglass" viewBox="0 0 30 30"><circle cx="12" cy="12" r="8" fill="none" stroke="#f2c14e" stroke-width="3.4"/><line x1="18" y1="18" x2="26" y2="26" stroke="#f2c14e" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="note">What is it? Find it!</div>
    </div>
    <div class="scenewrap mt" id="scene6">${sceneSVG({full:true,interactive:true})}</div>
    <div class="hintbox hidden" id="hintbox"></div>
    <div id="whereMount"></div>
    <div id="sayMount"></div>
  </div></div>`;

      spotlight([g.dataset.id],1600,true);
      if(q.where){whereRound(q,h)}
      else{
        if(h.n<3)A6.score++;
        $('#sayMount').innerHTML=sayBar(`<b>${esc(label(q.t))}</b>`,S.tr?W(q.t).tr:null);
        bindNext(()=>{flipTurn();A6.i++;renderAct6()});
      }
    }else{
      wobble(g);recordMiss(q.t);
      hintStep(h,
        ()=>{spotlight(itemsOf(q.t).map(i=>i.id),2600);setBubble('Look at this shelf!')},
        hintHTMLFor(label(q.t)),
        ()=>{setBolt('oops');setBubble('Say it with me!');
          spotlight(itemsOf(q.t).map(i=>i.id),0,true);
          A6.queue.push(q);
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${esc(label(q.t))}</b>${S.tr?`<span class="tr">${esc(W(q.t).tr)}</span>`:''}</div>
            <div class="saycue">${ICON.say} Say it with me!</div>

          bindNext(()=>{clearSpots();flipTurn();A6.i++;renderAct6()});
        });
    }
  }));
}
function whereRound(q,h){
  const single=q.where==='bike';
  const type=q.t; // 'bike' or 'bag'
  const qtext=single?'Where is the bike?':'Where are the bags?';
  const nbs=neighbours(type); // true neighbours; any is accepted
  const distractors=single?['balls','skateboards']:['skateboards','rulers'];
  const tiles=single
    ?[tile("It's",'gold'),tile('next to','teal'),tile('the','coral'),...nbs.map(n=>tile(pluralRaw(n),'',esc(plural(n)))),...distractors.map(d=>tile(d,'',d))]
    :[tile("They're",'gold'),tile('next to','teal'),tile('the','coral'),...nbs.map(n=>tile(pluralRaw(n),'',esc(plural(n)))),...distractors.map(d=>tile(d,'',d))];
  $('#whereMount').innerHTML=`<div class="qpanel mt">
    <div class="qtext">${esc(qtext)}${S.tr?`<span class="tr">${esc(CONFIG.gloss[qtext])}</span>`:''}</div>
    <div id="tb6"></div>
  </div>`;
  buildTiles($('#tb6'),{
    slots:4,tiles,
    accept:tok=>tok[0]===(single?"It's":"They're")&&tok[1]==='next to'&&tok[2]==='the'&&nbs.map(pluralRaw).includes(tok[3]),
    onCorrect(tok){
      if(h.n<3)A6.score++;
      setBolt('cheering');burst();
      const sent=single?`It's next to the ${tok[3]}.`:`They're next to the ${tok[3]}.`;
      const g=S.tr?(CONFIG.gloss[sent]||glossOf(tok[3])||null):null;
      spotlight(itemsOf(type).concat(itemsOf(singularOf(tok[3]))).map(i=>i.id),3200,true);
      $('#sayMount').innerHTML=sayBar(sent,g);
      bindNext(()=>{clearSpots();flipTurn();A6.i++;renderAct6()});
    },
    onWrong(){
      recordMiss(type);
      hintStep(h,
        ()=>{spotlight(itemsOf(type).concat(nbs.flatMap(itemsOf)).map(i=>i.id),2800);setBubble('Next to = neighbour!')},
        `<span>Hint: <b>${single?"It's":"They're"} next to the…</b></span>`,
        ()=>{setBolt('oops');setBubble('Say it with me!');
          const sent=single?"It's next to the rackets.":"They're next to the pens.";
          $('#sayMount').innerHTML=`<div class="saybar"><div class="sent"><b>${sent}</b>${S.tr?`<span class="tr">${esc(CONFIG.gloss[sent])}</span>`:''}</div>
            <div class="saycue">${ICON.say} Say it with me!</div>
            <button class="btn teal" id="nextBtn">Next${S.tr?`<span class="tr">${esc(CONFIG.ui['Next'])}</span>`:''}</button></div>`;
          A6.queue.push(q);
          bindNext(()=>{clearSpots();flipTurn();A6.i++;renderAct6()});
        });
    }
  });
}
function pluralRaw(t){return plural(t)}        // token value = plural label
function singularOf(pl){return Object.keys(CONFIG.words).find(t=>plural(t)===pl)||pl}

/* ============================================================
   ACTIVITY 7 — Shop report
   ============================================================ */
function renderAct7(){
  S.done[7]=true;S.open=true;
  const missedUnion=new Set([...S.stats[0].missed,...S.stats[1].missed]);
  const stamps=Object.keys(CONFIG.words).map(t=>{
    const got=S.saidWords.has(t)&&!missedUnion.has(t);
    return `<div class="stamp${got?' got':''}">${got?ICON.star(44):`<svg viewBox="0 0 60 60" style="width:44px;height:44px"><polygon points="${starPts(30,30,26,13,5)}" fill="none" stroke="#9a8db5" stroke-width="3" stroke-dasharray="5 4"/></svg>`}
      <span>${esc(label(t))}</span>${S.tr?`<span class="tr">${esc(W(t).tr)}</span>`:''}${got?'':'<span class="tr">review</span>'}</div>`;
  }).join('');
  $('#main').innerHTML=`<div class="screen"><div class="page">
    <h2>7 · Shop report <span class="tr">case closed!</span></h2>
    ${boltbar('cheering','Open for business! Great work!')}
    <div class="cols">
      <div style="flex:0 0 52%">
        <div class="scenewrap">${sceneSVG({full:true,signOn:true})}</div>
        <div class="neonwrap"><div class="neon flick">OPEN</div></div>
      </div>
      <div class="grow">
        <div class="scorepanel">
          <div class="calc">Team stars: ${S.stars} ★<small>every star stocked a shelf and lit a light</small></div>
        </div>
        <div class="stamps">${stamps}</div>
        <div class="btnrow">
          <button class="btn ghost" id="resetAll2">Reset all</button>
          <button class="btn" id="againBtn">Play again</button>
        </div>
        <div class="turnnote">Teachers: press and hold Bolt's logo (2 s) for the teacher view.</div>
      </div>
    </div>
  </div></div>`;
  $('#resetAll2').addEventListener('click',globalReset);
  $('#againBtn').addEventListener('click',()=>go(1));
}

/* ============================================================
   BOLT'S BONUS — free-choice sentence building
   ============================================================ */
function renderBonus(returnTo){
  $('#main').innerHTML=`<div class="screen"><div class="page">
    <h2>Bolt's bonus <span class="tr">free choice — any object, any color</span></h2>
    ${boltbar('welcome','Build your own sentence!')}
    <div class="qpanel">
      <div class="qtext" style="font-size:26px">1 · Pick a color:</div>
      <div class="tray" id="bcol">${Object.keys(CONFIG.colors).map(c=>`<button class="tile" data-c="${c}" style="background:${hex(c)};color:${['black','purple','blue','green'].includes(c)?'#fff':'var(--ink)'}">${c}${S.tr?` <span class="tr" style="font-size:16px">${esc(CONFIG.colors[c])}</span>`:''}</button>`).join('')}</div>
      <div class="qtext" style="font-size:26px;margin-top:14px">2 · Pick an object:</div>
      <div class="tray" id="bobj">${Object.keys(CONFIG.words).map(t=>`<button class="tile coral" data-t="${t}">${esc(label(t))}${S.tr?` <span class="tr" style="font-size:16px">${esc(W(t).tr)}</span>`:''}</button>`).join('')}</div>
      <div id="bb"></div>
      <div id="sayMount"></div>
    </div>
    <div class="btnrow"><button class="btn teal big" id="backBtn">Back</button></div>
  </div></div>`;
  let c=null,t=null;
  $('#backBtn').addEventListener('click',()=>{const lc=S.lastCalc&&S.lastCalc[returnTo];lc?completeScreen(returnTo,lc.calc,lc.small):go(returnTo)});
  $$('#bcol .tile').forEach(b=>b.addEventListener('click',()=>{c=b.dataset.c;maybe()}));
  $$('#bobj .tile').forEach(b=>b.addEventListener('click',()=>{t=b.dataset.t;maybe()}));
  function maybe(){
    if(!c||!t)return;
    const expected=["It's",'the',c,t];
    buildTiles($('#bb'),{
      slots:4,shuffle:true,
      tiles:[tile("It's",'gold'),tile('the','teal'),tile(c,'',c),tile(t,'coral',esc(label(t))),tile('a',''),tile('red','')],
      accept:tok=>tok.join('|')===expected.join('|'),
      onCorrect(){
        S.stars++;setBolt('cheering');burst();
        const sent=`It's the ${c} ${label(t)}.`;
        $('#sayMount').innerHTML=sayBar(sent,S.tr?`${esc(CONFIG.colors[c])} · ${esc(W(t).tr)}`:null,+1?null:null);
        bindNext(()=>{c=null;t=null;$('#bb').innerHTML='';$('#sayMount').innerHTML='';setBubble('Again! Pick a new one!')});
      },
      onWrong(){setBolt('oops');setBubble('Try again: It\'s — the — color — object!')}
    });
  }
}
</script>
<script>
'use strict';
/* ============================================================
   TEACHER VIEW — hidden: press & hold Bolt's logo for 2 s
   ============================================================ */
(function(){
  let timer=null;
  const logo=$('#logo');
  const start=e=>{timer=setTimeout(openTeacher,2000)};
  const cancel=()=>{clearTimeout(timer)};
  logo.addEventListener('pointerdown',start);
  logo.addEventListener('pointerup',cancel);
  logo.addEventListener('pointerleave',cancel);
})();
function openTeacher(){
  const missed=[0,1].map(i=>[...S.stats[i].missed]);
  const review=[...new Set([...missed[0],...missed[1]])];
  const unsaid=Object.keys(CONFIG.words).filter(t=>!S.saidWords.has(t));
  openModal(`<h2>Teacher view <span class="tr">hidden from students</span></h2>
    <table class="teachertable">
      <tr><th></th><th>${esc(S.players[0])}</th><th>${esc(S.players[1])}</th></tr>
      <tr><td><b>Hints used</b></td><td>${S.stats[0].hints}</td><td>${S.stats[1].hints}</td></tr>
      <tr><td><b>Words missed</b></td><td>${missed[0].map(t=>esc(label(t))).join(', ')||'—'}</td><td>${missed[1].map(t=>esc(label(t))).join(', ')||'—'}</td></tr>
    </table>
    <div class="note coral" style="margin-top:14px"><b>Review next lesson:</b><br>${[...new Set([...review,...unsaid])].map(t=>esc(label(t))).join(' · ')||'Nothing — great job!'}</div>
    <div class="btnrow"><button class="btn teal" id="closeT">Close</button></div>`);
  $('#closeT').addEventListener('click',closeModal);
}

/* ============================================================
   VALIDATION — every generated answer matches the inventory
   ============================================================ */
window.__check=function(){
  const issues=[];
  const expect={cdplayer:3,racket:6,calculator:5,skateboard:2,bag:3,bike:1};
  for(const t in expect)if(countOf(t)!==expect[t])issues.push(`count ${t}: ${countOf(t)} != ${expect[t]}`);
  const seen=new Set();
  INV.forEach(i=>{const k=i.type+'|'+i.color;if(seen.has(k))issues.push('duplicate type+color: '+k);seen.add(k)});
  const yesNo=CONFIG.isthere.map(q=>({q:`Is there a ${q.c} ${label(q.t)}?`,a:hasCT(q.c,q.t)}));
  if(yesNo.filter(x=>x.a).length!==3)issues.push('isthere yes/no split broken');
  if(!neighbours('bag').includes('pen'))issues.push('bags not next to pens');
  if(!neighbours('bike').includes('racket'))issues.push('bike not next to rackets');
  return {issues,yesNo,counts:Object.fromEntries(Object.keys(CONFIG.words).map(t=>[t,countOf(t)]))};
};

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
go(0);
</script>
